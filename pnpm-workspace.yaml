hoist: false
hoistPattern: []
autoInstallPeers: false
dedupePeerDependents: false
strictPeerDependencies: true

publicHoistPattern:
    - "vitest"
    - "@types/*"
    - "@vitest/*"
    - "@effect/vitest"

allowBuilds:
    "@parcel/watcher": true
    cpu-features: true
    esbuild: true
    msgpackr-extract: true
    ssh2: true
    unrs-resolver: true

overrides:
    "@effect/docgen>typescript": "7.0.2"
    "madge>typescript": "7.0.2"

peerDependencyRules:
    allowedVersions:
        typescript: "7.0.2"
        # babel-plugin-annotate-pure-calls still declares a `@babel/core: ^7.0.0` peer.
        "@babel/core": "8.0.1"

minimumReleaseAgeExclude:
    - effect-schemas
    - eftar

patchedDependencies:
    effect@4.0.0-beta.104: patches/effect@4.0.0-beta.104.patch
